name: Quality

# Every push and pull request: lint, unit and integration tests with coverage limits,
# browser tests of the real app on localhost, a performance comparison with the
# base branch, and security scans. Any failing job blocks the merge once it is a
# required check on main. The longer runs (DAST, Lighthouse) are nightly, in
# nightly.yml.
#
# There is no deploy stage: the app has no server and no staging host. A merge
# into main is the release; TVs fetch it on their next start (see README).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'

# Runners are pinned to Ubuntu 24.04: "ubuntu-latest" moved to 26.04, which the
# pinned Playwright 1.56.1 does not support.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint 10.15.0 (the app script must stay ES5 for older TVs)
        run: npx eslint .

  unit:
    name: unit and integration
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Tests, with coverage limits on the guide builder
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include=scripts/build-guide.js
          --test-coverage-lines=90 --test-coverage-branches=90 --test-coverage-functions=85
          test/*.test.js

  e2e:
    name: browser tests
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Flows through the app, then the crawler (network locked to localhost)
        run: npx playwright test
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results.json
            e2e-crawl.json
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  perf-smoke:
    name: performance smoke
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Time this version
        run: node perf/bench.js | tee head.json
      # The same timing script runs on the base branch's code, on this machine,
      # so a slower runner does not count as a regression.
      - name: Time the base version
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git worktree add ../base "$BASE"
          mkdir -p ../base/perf
          cp perf/bench.js ../base/perf/bench.js
          node ../base/perf/bench.js | tee base.json
      - name: Fail if more than 25% slower than the base
        if: github.event_name == 'pull_request'
        run: node perf/compare.js base.json head.json 25

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks v8.21.2 over the whole history
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --exit-code 1

  dependencies:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (high and critical fail)
        run: npm audit --audit-level=high
      - name: osv-scanner v1.9.2 on the lockfile
        run: >
          docker run --rm -v "$PWD:/src"
          ghcr.io/google/osv-scanner:v1.9.2
          --lockfile=/src/package-lock.json

  sast:
    name: semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep 1.99.0, JavaScript rules (the bundled hls.js is excluded)
        run: >
          docker run --rm -v "$PWD:/src" -w /src
          semgrep/semgrep:1.99.0
          semgrep scan --config p/javascript --metrics off --error
          --exclude lib --exclude node_modules
